<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>플로우 원데이 세미나</title>

  <style>
    /* 기본 리셋 */
    html, body { margin: 0; padding: 0; background: #0b0617; }
    img { display: block; width: 100%; height: auto; }

    /* 페이지 래퍼 (너무 넓게 늘어나는 걸 방지) */
    .wrap {
      max-width: 1200px;   /* 필요하면 1440 등으로 조정 */
      margin: 0 auto;
      background: #0b0617;
    }

    /* 하단 고정 플로팅 영역 */
    .floating-cta {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: min(92vw, 520px);
      z-index: 9999;
      padding: 0 8px;
    }

    .floating-cta a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      width: 100%;
      height: 56px;

      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      color: #ffffff;

      border-radius: 999px;
      background: #7c3aed; /* 보라 CTA */
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .floating-cta a:active { transform: translateY(1px); }

    /* 버튼 때문에 콘텐츠가 가려지지 않게 아래 여백 확보 */
    .spacer {
      height: 96px; /* 버튼 높이+여백 만큼 */
    }
  </style>
</head>

<body>
  <main class="wrap">
    <!-- 이미지 1장으로 페이지 구성 -->
    <img src="오프라인설명회_메인.png" alt="플로우 원데이 세미나 안내 이미지" />
    <div class="spacer" aria-hidden="true"></div>
  </main>

  <!-- 하단 플로팅 버튼 -->
  <div class="floating-cta">
    <a href="https://share.hsforms.com/1eGY_C79xRGyRFqEJTOv__Qec1ox" target="_blank" rel="noopener noreferrer">
      원데이 세미나 신청
    </a>
  </div>
</body>
</html>
