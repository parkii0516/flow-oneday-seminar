<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>플로우 원데이 세미나</title>
  <style>
    :root{
      --bg:#0b0617;
      --cta:#7c3aed;
    }
    html,body{margin:0;padding:0;background:var(--bg);}

    /* 이미지: 화면 가득 + 반응형 */
    .page img{
      display:block;
      width:100%;
      height:auto;
    }

    /* 하단 CTA 바(샘플 페이지 느낌) */
    .cta-bar{
      position:fixed;
      left:0; right:0; bottom:0;
      z-index:9999;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(11,6,23,.92), rgba(11,6,23,0));
      backdrop-filter: blur(10px);
    }
    .cta-inner{
      max-width: 720px;
      margin: 0 auto;
    }
    .cta-btn{
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
      height:78px;             /* 더 크게 */
      border-radius: 999px;
      text-decoration:none;
      color:#fff;
      font-weight:800;
      font-size:19px;
      letter-spacing:-0.2px;
      background: var(--cta);
      box-shadow: 0 16px 50px rgba(0,0,0,.50);
    }
    .cta-btn:hover{filter:brightness(1.05);}
    .cta-btn:active{transform:translateY(1px);}

    /* 버튼에 가리지 않게 하단 여백 */
    .spacer{height:120px;}
  </style>
</head>

<body>
  <main class="page">
    <img src="오프라인설명회_메인.png" alt="플로우 원데이 세미나 안내" />
    <div class="spacer" aria-hidden="true"></div>
  </main>

  <div class="cta-bar">
    <div class="cta-inner">
      <a class="cta-btn" href="https://share.hsforms.com/1eGY_C79xRGyRFqEJTOv__Qec1ox?csm_utm_source=home_banner" target="_blank" rel="noopener noreferrer">
        원데이 세미나 신청
      </a>
    </div>
  </div>
</body>
</html>
